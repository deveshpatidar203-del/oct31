name: myworkflow_oct31

on:
  push:

jobs:
  myjobs1:
    runs-on: ubuntu-latest

    steps:
      - name: mystep1
        run: |
          whoami
          cat /etc/os-release
          docker --version
          docker compose version
          systemctl status docker
          ls -al
      - name: mystep2- Checkout the source code
        uses: actions/checkout@v4
      - name: mystep3- Check if the source code is available in workspace or not
        run: ls -al

      - name: mystep4- Build Docker image
        run: |
          docker image build -t deveshpatidar/myimage_oct31:t${{ github.run_number }} -f Dockerfile .
      - name: mystep5- Check if the image is build success
        run: docker images
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push image to Docker Hub
        run: |
          docker image push deveshpatidar/myimage_oct31:t${{ github.run_number }}
